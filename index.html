@keyframes fadeScene {

}



.submit-pill::after {

.submit-pill:hover {

<stop offset="0%" stop-color="#e05889"/>

<stop offset="55%" stop-color="#942169"/>

<linearGradient id="rightSlope" x1="0" y1="0" x2="0" y2="1">

<stop offset="0%" stop-color="#c23678"/>

<stop offset="65%" stop-color="#751a5f"/>

<stop offset="100%" stop-color="#440d42"/>

</linearGradient>

</defs>



<polygon points="-30,795 160,380 252,475 372,795" fill="url(#leftPeak)"/>

<polygon points="160,380 204,424 156,466 116,446" fill="#f79bb3" opacity="0.55"/>

<polygon points="195,468 232,508 188,522 172,492" fill="#460f44" opacity="0.68"/>



<path d="M 245 795 Q 530 680 810 742 T 1360 715 L 1630 742 L 1630 795 Z" fill="url(#rightSlope)" opacity="0.9"/>

<path d="M 1030 795 Q 1280 570 1630 610 L 1630 795 Z" fill="url(#rightSlope)"/>

<script>

const card = document.getElementById('loginCard');

const sceneLayer = document.getElementById('parallaxScene');

const starsLayer = document.getElementById('starsLayer');

const moonLayer = document.getElementById('moonLayer');

const loginForm = document.getElementById('loginForm');

const btnEntrar = document.getElementById('btnEntrar');

const feedbackMsg = document.getElementById('feedbackMsg');

const usuarioInput = document.getElementById('usuario');

const lembrarCheck = document.getElementById('lembrar');



if (usuarioInput && lembrarCheck) {

const salvo = localStorage.getItem('ceep_usuario_lembrado');

if (salvo) {

usuarioInput.value = salvo;

lembrarCheck.checked = true;

}

}



document.addEventListener('mousemove', (e) => {

const dx = (e.clientX / window.innerWidth) - 0.5;

const dy = (e.clientY / window.innerHeight) - 0.5;



if (sceneLayer) {

sceneLayer.style.transform = `translate3d(${(-dx * 14).toFixed(1)}px, ${(-dy * 8).toFixed(1)}px, 0)`;

}

if (starsLayer) {

starsLayer.style.transform = `translate3d(${(-dx * 6).toFixed(1)}px, ${(-dy * 5).toFixed(1)}px, 0)`;

}

if (moonLayer) {

moonLayer.style.transform = `rotate(-18deg) translate3d(${(-dx * 9).toFixed(1)}px, ${(-dy * 6).toFixed(1)}px, 0)`;

}



if (card) {

const rect = card.getBoundingClientRect();

const gx = e.clientX - rect.left;

const gy = e.clientY - rect.top;

card.style.setProperty('--gx', `${gx.toFixed(0)}px`);

card.style.setProperty('--gy', `${gy.toFixed(0)}px`);



const insideX = Math.max(-1, Math.min(1, (e.clientX - (rect.left + rect.width / 2)) / (rect.width / 2)));

const insideY = Math.max(-1, Math.min(1, (e.clientY - (rect.top + rect.height / 2)) / (rect.height / 2)));

const isNear = Math.abs(dx) < 0.45 && Math.abs(dy) < 0.45;

const rotY = isNear ? (insideX * 3.5).toFixed(2) : '0';

const rotX = isNear ? (-insideY * 3.5).toFixed(2) : '0';

card.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;

}

});



document.addEventListener('mouseleave', () => {

if (card) {

card.style.transform = 'rotateX(0deg) rotateY(0deg)';

}

});



function restaurarBotao() {

btnEntrar.disabled = false;

btnEntrar.classList.remove('loading');

btnEntrar.textContent = 'Entrar';

}



function mostrarErro(texto) {

if (!feedbackMsg) return;

feedbackMsg.textContent = texto;

feedbackMsg.classList.add('visible');

}



if (loginForm && btnEntrar) {

loginForm.addEventListener('submit', async (e) => {

e.preventDefault();

if (feedbackMsg) {

feedbackMsg.classList.remove('visible');

feedbackMsg.textContent = '';

}



if (usuarioInput && lembrarCheck) {

if (lembrarCheck.checked) {

localStorage.setItem('ceep_usuario_lembrado', usuarioInput.value.trim());

} else {

localStorage.removeItem('ceep_usuario_lembrado');

}

}



btnEntrar.disabled = true;

btnEntrar.classList.add('loading');

btnEntrar.innerHTML = '<span class="btn-spinner" aria-hidden="true"></span>Entrando...';



try {

const formData = new FormData(loginForm);

const resp = await fetch(loginForm.getAttribute('action') || 'login.php', {

method: 'POST',

body: formData,

credentials: 'same-origin'

});



const dados = await resp.json();



if (dados && dados.sucesso) {

document.body.classList.add('leaving');

const destino = dados.redirecionar || 'principal.php';

setTimeout(() => {

window.location.href = destino;

}, 280);

} else {

restaurarBotao();

mostrarErro((dados && dados.mensagem) || 'Usuário ou senha inválidos.');

}

} catch (err) {

restaurarBotao();

mostrarErro('Não foi possível concluir a autenticação. Tente novamente.');

}

});

}

</script>
